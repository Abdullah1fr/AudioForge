name: Build AudioForge APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract AudioForge project
        run: |
          unzip -q AudioForge_Stage1.zip -d extracted

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f -name "settings.gradle.kts" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found."
            exit 1
          fi

          echo "Project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioForge-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
